<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Left stalk -->
  <rect x="7" y="4" width="6.5" height="25" rx="3" fill="#059669"/>
  <!-- Left node rings -->
  <rect x="5.5" y="12" width="9.5" height="2.5" rx="1.25" fill="#34d399"/>
  <rect x="5.5" y="21" width="9.5" height="2.5" rx="1.25" fill="#34d399"/>
  <!-- Leaf from top of left stalk -->
  <path d="M13.5 7 C15 4 19 4 17 6.5 C15.5 8 13.5 8 13.5 7Z" fill="#6ee7b7"/>

  <!-- Right stalk (offset 4px lower) -->
  <rect x="18.5" y="8" width="6.5" height="21" rx="3" fill="#047857"/>
  <!-- Right node rings -->
  <rect x="17" y="16" width="9.5" height="2.5" rx="1.25" fill="#10b981"/>
  <rect x="17" y="24" width="9.5" height="2.5" rx="1.25" fill="#10b981"/>
  <!-- Leaf from top of right stalk -->
  <path d="M25 11 C27 8 30 8 28.5 10.5 C27 12 25 12 25 11Z" fill="#6ee7b7"/>
</svg>
